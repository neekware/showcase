name: Build Workflow
on:
  push:
    branches:
      - feat/*
      - fix/*
      - hotfix/*
      - release/*
      - dev
      - ci
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'apps/**'
      - 'libs/**'

jobs:
  build:
    if: github.repository == 'neekware/showcase'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: [lint, build:main, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm i
      - name: Run ${{ matrix.step }}
        run: pnpm run ${{ matrix.step }}
