# Name of the workflow
name: Build Workflow

# Trigger the workflow on push events to specific branches and paths
on:
  push:
    branches:
      - feat/* # Feature branches
      - fix/* # Fix branches
      - hotfix/* # Hotfix branches
      - release/* # Release branches
      - dev # Development branch
      - ci # Continuous Integration branch
      - main # Main branch
    paths:
      - 'apps/**' # Apps directory
      - 'libs/**' # Libraries directory

# Job named "build"
jobs:
  build:
    # Run the job on an Ubuntu environment
    runs-on: ubuntu-latest

    # Cache pnpm store directory
    env:
      PNP_CACHE_DIR: ~/.pnpm-store
    strategy:
      matrix:
        step: [lint, build, test] # Matrix of steps to run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache pnpm dependencies
      - uses: actions/cache@v2
        with:
          path: ${{ env.PNP_CACHE_DIR }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # Setup Node.js 18.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: UTC time in ISO 8601 format
        id: utc-time
        run: |
          UTC_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          echo "date=$UTC_DATE" >> "$GITHUB_OUTPUT"

      # Get the version from the package.json file
      - name: Get web app package.json version
        id: web-app-package
        run: |
          LF_VERSION=$(cat apps/web/package.json | jq -r '.version')
          echo "version=$LF_VERSION" >> "$GITHUB_OUTPUT"

      # Update the app config with the version
      - name: update app config, version, hash, and date
        run: |
          sed -i "s/i-am-a-version/${{steps.web-app-package.outputs.version}}/g" $GITHUB_WORKSPACE/apps/web/src/cfg/config.json
          sed -i "s/i-am-a-date/${{steps.utc-time.outputs.date}}/g" $GITHUB_WORKSPACE/apps/web/src/cfg/config.json
          sed -i "s/i-am-a-hash/${{github.sha}}/g" $GITHUB_WORKSPACE/apps/web/src/cfg/config.json
          echo `cat $GITHUB_WORKSPACE/apps/web/src/cfg/config.json`

      # Run the step (lint, build, or test)
      - name: Run step
        run: |
          if [ "${{ matrix.step }}" == "lint" ]; then
            pnpm run lint
          elif [ "${{ matrix.step }}" == "build" ]; then
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              pnpm run build:main
            elif [ "${{ github.ref }}" == "refs/heads/ci" ]; then
              pnpm run build:ci
            else
              pnpm run build:dev
            fi
          else
            pnpm run test
          fi
