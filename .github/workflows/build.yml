name: Build Workflow
on:
  push:
    branches:
      - feat/*
      - fix/*
      - hotfix/*
      - release/*
      - dev
      - ci
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'apps/**'
      - 'libs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: [lint, build, test]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js and cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm i

      # Run steps
      - name: run ${{ matrix.step }}
        if: ${{ matrix.step == 'lint' }}
        run: pnpm run lint
      - name: run ${{ matrix.step }}
        if: ${{ matrix.step == 'build' && github.ref == 'refs/heads/main' }}
        run: pnpm run build:main
      - name: run ${{ matrix.step }}
        if: ${{ matrix.step == 'build' && github.ref == 'refs/heads/ci' }}
        run: pnpm run build:ci
      - name: run ${{ matrix.step }}
        if: ${{ matrix.step == 'build' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/ci' }}
        run: pnpm run build:dev
