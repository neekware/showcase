name: Deploy to Vercel

# Environment variables
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }} # Retrieves the Vercel organization ID from GitHub secrets
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }} # Retrieves the Vercel project ID from GitHub secrets

# Trigger the workflow on the following events
on:
  workflow_dispatch: # Manually trigger the workflow
  release:
    types: [published] # Trigger on published releases
  push:
    branches:
      - main # Trigger on pushes to the main branch
    paths:
      - 'apps/**' # Trigger on changes to apps directory
      - 'libs/**' # Trigger on changes to libs directory
    tags:
      - 'v*'

# Job: deploy
jobs:
  deploy:
    # Only run this job if the repository is neekware/showcase, on tag creation
    if: github.repository == 'neekware/showcase' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest # Run on an ubuntu-latest environment

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # This step checks out the code with all history.

      - name: UTC time in ISO 8601 format
        id: utc-time
        run: |
          UTC_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          echo "date=$UTC_DATE" >> "$GITHUB_OUTPUT"

      # Get the version from the package.json file
      # This step retrieves the version from the package.json file using jq.
      - name: Get web app package.json version
        id: web-app-package
        run: |
          LF_VERSION=$(cat apps/web/package.json | jq -r '.version')
          echo "version=$LF_VERSION" >> "$GITHUB_OUTPUT"

      # Update the app config with the version
      - name: update app config, version, hash, and date
        run: |
          sed -i 's/i-am-a-version/${{steps.web-app-package.outputs.version}}/g' apps/web/src/cfg/config.json
          sed -i 's/i-am-a-date/${{steps.utc-time.outputs.date}}/g' apps/web/src/cfg/config.json
          sed -i 's/i-am-a-hash/${{github.sha}}/g' apps/web/src/cfg/config.json
          echo `cat apps/web/src/cfg/config.json`
        # This step updates the app config with the version.

      # Install pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # Set up Node.js and cache pnpm
      - name: Set up Node.js and cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Use Node.js 18
          cache: 'pnpm' # Cache pnpm dependencies
        # This step sets up Node.js and caches pnpm dependencies.

      # Install dependencies
      - name: Install dependencies
        run: pnpm i
        # This step installs the dependencies using pnpm.

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        run: |
          OUTPUT=$(du --inodes -d 5 .vercel/output)
          echo "$OUTPUT"
          LAST=$(echo "$OUTPUT" | tail -n 1)
          PERCENTAGE=$(echo "$LAST" | awk 'BEGIN {maxtotal=15000} { printf "%.2f%%", ($1/maxtotal*100) }')
          echo "Vercel file usage percentage" >> $GITHUB_STEP_SUMMARY
          echo "$PERCENTAGE" >> $GITHUB_STEP_SUMMARY
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
