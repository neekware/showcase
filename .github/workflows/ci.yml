name: CI/CD Workflow

# Trigger the workflow on push events to specific branches and paths
on:
  push:
    branches:
      - feat/* # Feature branches
      - fix/* # Fix branches
      - hotfix/* # Hotfix branches
      - release/* # Release branches
      - dev # Development branch
      - ci # Continuous Integration branch
      - main # Main branch
    paths:
      - '.github/workflows/ci.yml' # Workflow file itself
      - 'apps/**' # Apps directory
      - 'libs/**' # Libraries directory

jobs:
  DEBUG:
    runs-on: ubuntu-latest
    steps:
      - name: Debug
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

  SETUP_ENVIRONMENT:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js and cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm

  CHECKOUT_CODE:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: SETUP_ENVIRONMENT
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: pnpm i

  LINT:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [SETUP_ENVIRONMENT, CHECKOUT_CODE]
    steps:
      - name: Run linting
        run: pnpm lint

  TEST:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [SETUP_ENVIRONMENT, CHECKOUT_CODE]
    steps:
      - name: Run tests
        run: npm test

  BUILD:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [SETUP_ENVIRONMENT, CHECKOUT_CODE]
    steps:
      - name: Run build
        run: pnpm build

  E2E:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [SETUP_ENVIRONMENT, CHECKOUT_CODE]
    steps:
      - name: Install Playwright & Friends
        run: pnpx playwright install --with-deps
      - name: Run E2E tests
        run: pnpm e2e

  DEPLOY:
    strategy:
      fail-fast: true
    if: startsWith(github.ref, 'refs/tags/v0.0.0')
    runs-on: ubuntu-latest
    needs: [SETUP_ENVIRONMENT, CHECKOUT_CODE]
    steps:
      - name: Deploy to production
        run: pnpm deploy
