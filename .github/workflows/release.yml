# Name of the workflow
name: Releases

# Trigger the workflow on push events to the main branch
on:
  push:
    branches:
      - main

    # Ignore changes to files in the tools directory
    paths-ignore:
      - 'tools/**'

# Concurrency group to ensure only one job runs at a time
concurrency:
  group: 'main-branch'

# Job named "changelog"
jobs:
  changelog:
    # Conditional statement to check if the repository is "neekware/showcase"
    if: github.repository == 'neekware/showcase'

    # Run the job on an Ubuntu environment
    runs-on: ubuntu-latest

    # Steps in the job
    steps:
      # Setup Node.js 18.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      # Checkout the repository with all releases
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # This step checks out the repository with all releases, instead of just the latest commit.

      # Create a temporary branch to push release info to
      - name: Create temporary branch
        run: git branch "release-from-${{ github.sha }}" "${{ github.sha }}"
        # This step creates a temporary branch with a unique name based on the commit SHA.

      # Switch to the temporary branch
      - name: Switch to new branch
        run: git checkout release-from-${{ github.sha }}
        # This step switches to the temporary branch.

      - name: UTC time in ISO 8601 format
        run: |
          UTC_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          echo "date=$UTC_DATE" >> "$GITHUB_OUTPUT"

      # Get the version from the package.json file
      # This step retrieves the version from the package.json file using jq.
      - name: Get web app package.json version
        id: web-app
        run: |
          LF_VERSION=$(cat apps/web/package.json | jq -r '.version')
          echo "version=$LF_VERSION" >> "$GITHUB_OUTPUT"

      # Update the app config with the version
      - name: update app config, version, hash, and date
        run: |
          sed -i 's/i-am-a-version/${{steps.web-app.outputs.version}}/g' apps/web/src/cfg/config.json
          sed -i 's/i-am-a-hash/${{github.sha}}/g' apps/web/src/cfg/config.json
          sed -i 's/i-am-a-date/${{steps.web-app.outputs.date}}/g' apps/web/src/cfg/config.json
          echo `cat apps/web/src/cfg/config.json`
        # This step updates the app config with the version.

      # Generate the changelog using conventional-changelog-action
      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: './package.json,./pnpm-lock.yaml,./apps/web/src/cfg/config.json'
          git-branch: 'release-from-${{ github.sha }}'
          skip-git-pull: true
        # This step generates the changelog using the conventional-changelog-action.

      # Create a pull request with the release info
      - name: Create PR with release info
        if: steps.changelog.outputs.skipped == 'false'
        id: create-pr
        run: gh pr create --base main --head release-from-${{ github.sha }} --title 'Merge new release into main' --body 'Created by Github action'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This step creates a pull request with the release info.

      # Merge the pull request
      - name: Merge PR with release info
        if: steps.changelog.outputs.skipped == 'false'
        id: merge-pr
        run: gh pr merge --admin --merge --subject 'Merge release info' --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This step merges the pull request.

      # Create a release with the last commit
      - name: Create release with last commit
        if: steps.changelog.outputs.skipped == 'false'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.CHANGELOG_RELEASE }} # Setup in the repository secrets
          tag: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
        # This step creates a release with the last commit.
