name: CI/CD Workflow

# Trigger the workflow on push events to specific branches and paths
on:
  push:
    branches:
      - feat/* # Feature branches
      - fix/* # Fix branches
      - hotfix/* # Hotfix branches
      - release/* # Release branches
      - dev # Development branch
      - ci # Continuous Integration branch
      - main # Main branch
    paths:
      - '.github/workflows/ci.yml' # Workflow file itself
      - 'apps/**' # Apps directory
      - 'libs/**' # Libraries directory

jobs:
  DEBUG:
    runs-on: ubuntu-latest
    steps:
      - name: Debug
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

  SETUP_PNPM:
    runs-on: ubuntu-latest
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Cache pnpm
        uses: actions/cache@v3
        with:
          key: pnpm-${{ github.sha }}-v9
          path: ~/.pnpm-store

  CHECKOUT_CODE:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [SETUP_PNPM]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

  SETUP_NODE:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [CHECKOUT_CODE]
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

  INSTALL_DEPS:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [SETUP_NODE]
    steps:
      - name: Install dependencies
        run: pnpm i

  LINT:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [INSTALL_DEPS]
    steps:
      - name: Run linting
        run: pnpm lint

  TEST:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [INSTALL_DEPS]
    steps:
      - name: Run tests
        run: npm test

  BUILD:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [INSTALL_DEPS]
    steps:
      - name: Run build
        run: pnpm build

  E2E:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    needs: [INSTALL_DEPS]
    steps:
      - name: Install Playwright & Friends
        run: pnpx playwright install --with-deps
      - name: Run E2E tests
        run: pnpm e2e

  DEPLOY:
    strategy:
      fail-fast: true
    if: github.repository == 'neekware/showcase' && startsWith(github.ref, 'refs/tags/v0.0.0')
    runs-on: ubuntu-latest
    needs: [INSTALL_DEPS]
    steps:
      - name: Deploy to production
        run: pnpm deploy
